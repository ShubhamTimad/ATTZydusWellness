# Full stack: PostgreSQL + FastAPI backend + React/nginx frontend.
#
#   cp .env.docker.example .env.docker   # edit secrets and URLs first
#   docker compose --env-file .env.docker up -d --build
#
# Or: ./scripts/docker-deploy.sh
#
name: takeda_att

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takeda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-takeda_att}
    volumes:
      - takeda_att_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takeda} -d ${POSTGRES_DB:-takeda_att}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - takeda_att_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-takeda}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-takeda_att}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-before-deploy}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:8083}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8083}
      FRONTEND_ADMIN_URL: ${FRONTEND_ADMIN_URL:-http://localhost:8083/admin}
      ENFORCE_SUPERUSER_ON_ADMIN: ${ENFORCE_SUPERUSER_ON_ADMIN:-false}
      SYNC_MODULES_ON_STARTUP: ${SYNC_MODULES_ON_STARTUP:-true}
      SEED_SYSTEM_EMAIL_TEMPLATES: ${SEED_SYSTEM_EMAIL_TEMPLATES:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Takeda Workspace}
      BACKEND_PORT: ${BACKEND_PORT:-9005}
    expose:
      - "${BACKEND_PORT:-9005}"
    volumes:
      - takeda_att_uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BACKEND_PORT:-9005}/docs > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - takeda_att_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        BACKEND_UPSTREAM_PORT: ${BACKEND_PORT:-9005}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_HOST_BIND:-0.0.0.0}:${APP_PORT:-8083}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - takeda_att_network

volumes:
  takeda_att_db_data:
  takeda_att_uploads:

networks:
  takeda_att_network:
    driver: bridge
