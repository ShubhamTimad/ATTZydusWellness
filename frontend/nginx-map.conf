# Included inside http {} via conf.d — safe for map.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Pass the edge proxy's client address through. Appending $remote_addr here
# would make uvicorn (which trusts the last hop) see this container instead.
map $http_x_forwarded_for $proxy_x_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}
