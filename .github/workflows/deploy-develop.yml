name: Deploy develop

# Push to develop → Teams pending (≈5 min) → wait → deploy → Teams success/failure.
#
# Wait 5 min: do nothing.
# Deploy now (real one-click): Teams button opens DEPLOY_NOW_URL
#   (server /api/deploy-now?token=… → GitHub workflow_dispatch skip_wait=true).
# Cancel: open the run → Cancel workflow.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_wait:
        description: "Deploy now — skip the 5-minute wait"
        type: boolean
        default: true

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  announce-pending:
    name: Notify Teams — deploy pending
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Post pending deploy to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DEPLOY_NOW_URL: ${{ secrets.DEPLOY_NOW_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-develop.yml
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          SKIP_WAIT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_wait == true }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          if [ "${SKIP_WAIT}" = "true" ]; then
            TITLE="Deploy develop starting now"
            DETAIL="Skip-wait requested — deploying immediately after build.
          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}"
            COLOR="Warning"
          else
            TITLE="Server update in ~5 minutes"
            DETAIL="A develop deploy is queued.

          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}

          • Wait 5 minutes — do nothing; deploy starts automatically.
          • Deploy now — tap the button (skips wait immediately).
          • Cancel — open this run → Cancel workflow."
            COLOR="Warning"
          fi
          export TITLE DETAIL COLOR RUN_URL WORKFLOW_URL SKIP_WAIT DEPLOY_NOW_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Warning")
          run_url = os.environ["RUN_URL"]
          workflow_url = os.environ["WORKFLOW_URL"]
          deploy_now = (os.environ.get("DEPLOY_NOW_URL") or "").strip()
          skip = os.environ.get("SKIP_WAIT", "false") == "true"
          actions = [{"type": "Action.OpenUrl", "title": "View / cancel run", "url": run_url}]
          if not skip:
              # Prefer real one-click URL; otherwise open workflow page (must click Run workflow).
              now_url = deploy_now or workflow_url
              now_title = "Deploy now (no 5 min wait)" if deploy_now else "Open GitHub → Run workflow (skip wait)"
              actions = [
                  {"type": "Action.OpenUrl", "title": now_title, "url": now_url},
                  {"type": "Action.OpenUrl", "title": "Wait / view run", "url": run_url},
                  {"type": "Action.OpenUrl", "title": "Cancel run", "url": run_url},
              ]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": actions,
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams pending notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL notify failed — deploy will still continue"; }

  wait-gate:
    name: Wait 5 minutes (or skip)
    needs: announce-pending
    runs-on: ubuntu-latest
    steps:
      - name: Hold deploy window
        env:
          SKIP_WAIT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_wait == true }}
        run: |
          set -euo pipefail
          case "${SKIP_WAIT}" in
            true|True|TRUE|1) echo "skip_wait=true — continuing immediately"; exit 0 ;;
          esac
          echo "Waiting 5 minutes before deploy."
          for i in $(seq 1 30); do
            echo "Wait tick ${i}/30 ($(date -u +%H:%M:%S) UTC)"
            sleep 10
          done
          echo "Wait finished — proceeding to deploy"

  deploy:
    name: Deploy to server
    needs: wait-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            PREVIOUS_SHA="$(git rev-parse HEAD)"

            git fetch origin
            git checkout develop
            git pull origin develop
            NEW_SHA="$(git rev-parse HEAD)"

            echo "Deploying $NEW_SHA (previous was $PREVIOUS_SHA)"

            docker compose --env-file .env.docker down
            docker compose --env-file .env.docker build
            docker compose --env-file .env.docker up -d

            echo "Waiting for containers..."
            sleep 25

            echo "===== docker compose ps ====="
            docker compose --env-file .env.docker ps

            FAILED=0

            if docker compose --env-file .env.docker ps | grep -Eiq 'Exit|exited|Restarting|unhealthy|dead'; then
              echo "STATUS CHECK FAILED"
              FAILED=1
            fi

            echo "===== recent logs ====="
            docker compose --env-file .env.docker logs --tail=100 || true

            if docker compose --env-file .env.docker logs --tail=300 2>&1 | grep -Eiq 'Traceback|FATAL|panic|Error response from daemon|npm ERR'; then
              echo "LOG CHECK found serious errors"
              FAILED=1
            fi

            if ! curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:8083/; then
              echo "Frontend HTTP check failed"
              FAILED=1
            fi
            if ! curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:8083/api/docs; then
              echo "API docs HTTP check failed"
              FAILED=1
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "Deploy unhealthy — reverting to $PREVIOUS_SHA"
              if [ "$PREVIOUS_SHA" = "$NEW_SHA" ]; then
                echo "No previous distinct commit to revert to"
                exit 1
              fi

              git checkout "$PREVIOUS_SHA"
              docker compose --env-file .env.docker down
              docker compose --env-file .env.docker build
              docker compose --env-file .env.docker up -d
              sleep 20
              docker compose --env-file .env.docker ps

              echo "Reverted to $PREVIOUS_SHA because new deploy failed"
              exit 1
            fi

            echo "Deploy OK: $NEW_SHA"
            git checkout develop
            git reset --hard origin/develop

  notify-teams-success:
    name: Notify Teams on success
    needs: [build, wait-gate, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Post success to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop succeeded"
          export DETAIL="Server updated successfully.
          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}"
          export COLOR="Good"
          export RUN_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Good")
          run_url = os.environ["RUN_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View workflow run", "url": run_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams success notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL success notify failed"; }

  notify-teams-failure:
    name: Notify Teams on failure
    needs: [build, announce-pending, wait-gate, deploy]
    if: always() && (needs.build.result == 'failure' || needs.announce-pending.result == 'failure' || needs.wait-gate.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-develop.yml
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop failed"
          export DETAIL="Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}

          Retry: Run workflow again (optionally with skip wait)."
          export COLOR="Attention"
          export RUN_URL WORKFLOW_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Attention")
          run_url = os.environ["RUN_URL"]
          workflow_url = os.environ["WORKFLOW_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View workflow run", "url": run_url},
                          {"type": "Action.OpenUrl", "title": "Retry workflow", "url": workflow_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams failure notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL failure notify failed"; }
