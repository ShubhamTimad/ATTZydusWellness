name: Deploy develop

# Push to develop → Teams pending → deploy → Teams success/failure.
# Manual: Actions → Deploy develop → Run workflow.
# Cancel: open the run → Cancel workflow.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  announce-pending:
    name: Notify Teams — deploy pending
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Post pending deploy to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop starting"
          export DETAIL="Build passed — deploying to the server now.
          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}

          Cancel: open the run → Cancel workflow."
          export COLOR="Warning"
          export RUN_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Warning")
          run_url = os.environ["RUN_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View / cancel run", "url": run_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams pending notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL notify failed — deploy will still continue"; }

  deploy:
    name: Deploy to server
    needs: [announce-pending]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "===== disk before cleanup ====="
            df -h / || true
            # Free space from old images/build cache (never --volumes: that would wipe DB data).
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            echo "===== disk after cleanup ====="
            df -h / || true

            PREVIOUS_SHA="$(git rev-parse HEAD)"
            REPO="${{ github.repository }}"
            EXPECTED_SHA="${{ github.sha }}"
            ORIGIN_URL="$(git remote get-url origin)"
            echo "origin=$ORIGIN_URL"
            echo "expected repo=$REPO sha=$EXPECTED_SHA"

            # Server clone must track THIS GitHub repo. A wrong origin (or a
            # polluted fetch) previously reset develop onto another project
            # whose compose file required backend/backend.env.
            if ! printf '%s' "$ORIGIN_URL" | grep -F -q "$REPO"; then
              echo "WARNING: origin does not point at $REPO (was $ORIGIN_URL) — fixing"
              if printf '%s' "$ORIGIN_URL" | grep -q '^git@'; then
                git remote set-url origin "git@github.com:${REPO}.git"
              else
                git remote set-url origin "https://github.com/${REPO}.git"
              fi
              echo "origin now $(git remote get-url origin)"
            fi

            git fetch origin develop
            if ! git cat-file -t "$EXPECTED_SHA" >/dev/null 2>&1; then
              git fetch origin "$EXPECTED_SHA"
            fi
            if ! git cat-file -t "$EXPECTED_SHA" >/dev/null 2>&1; then
              echo "FATAL: commit $EXPECTED_SHA is not in origin after fetch"
              git remote -v
              git log -1 --oneline origin/develop || true
              exit 1
            fi

            git checkout -B develop "$EXPECTED_SHA"
            NEW_SHA="$(git rev-parse HEAD)"
            if [ "$NEW_SHA" != "$EXPECTED_SHA" ]; then
              echo "FATAL: HEAD $NEW_SHA != workflow sha $EXPECTED_SHA"
              exit 1
            fi

            echo "Deploying $NEW_SHA (previous was $PREVIOUS_SHA)"
            if [ ! -f .env.docker ]; then
              echo "FATAL: .env.docker missing in $(pwd)"
              exit 1
            fi
            if grep -qE 'backend/backend\.env' docker-compose.yml docker-compose*.yml 2>/dev/null; then
              echo "FATAL: compose still references backend/backend.env — wrong checkout"
              exit 1
            fi

            # Built-in edge proxy only when ENABLE_EDGE_PROXY=true (default false —
            # host :80/:443 owned by another reverse proxy → 127.0.0.1:8083).
            COMPOSE_HTTPS=""
            if grep -qE '^ENABLE_EDGE_PROXY=(true|1|yes)$' .env.docker; then
              COMPOSE_HTTPS="--profile https"
              echo "ENABLE_EDGE_PROXY=true — Compose profile https"
            else
              echo "External TLS proxy mode — core stack only (db/backend/frontend)"
            fi

            docker compose --env-file .env.docker --profile https down --remove-orphans
            docker compose --env-file .env.docker build
            # shellcheck disable=SC2086
            docker compose --env-file .env.docker $COMPOSE_HTTPS up -d

            echo "Waiting for containers..."
            sleep 25

            echo "===== docker compose ps ====="
            # shellcheck disable=SC2086
            docker compose --env-file .env.docker $COMPOSE_HTTPS ps

            FAILED=0

            # shellcheck disable=SC2086
            if docker compose --env-file .env.docker $COMPOSE_HTTPS ps | grep -Eiq 'Exit|exited|Restarting|unhealthy|dead'; then
              echo "STATUS CHECK FAILED"
              FAILED=1
            fi

            echo "===== recent logs ====="
            # shellcheck disable=SC2086
            docker compose --env-file .env.docker $COMPOSE_HTTPS logs --tail=100 || true

            # shellcheck disable=SC2086
            if docker compose --env-file .env.docker $COMPOSE_HTTPS logs --tail=300 2>&1 | grep -Eiq 'Traceback|FATAL|panic|Error response from daemon|npm ERR'; then
              echo "LOG CHECK found serious errors"
              FAILED=1
            fi

            APP_PORT="$(grep -E '^APP_PORT=' .env.docker | tail -1 | cut -d= -f2- | tr -d '\r' || true)"
            APP_PORT="${APP_PORT:-8083}"

            if ! curl -fsS -o /dev/null --max-time 15 "http://127.0.0.1:${APP_PORT}/"; then
              echo "Frontend HTTP check failed (127.0.0.1:${APP_PORT})"
              FAILED=1
            fi
            if ! curl -fsS -o /dev/null --max-time 15 "http://127.0.0.1:${APP_PORT}/api/docs"; then
              echo "API docs HTTP check failed (127.0.0.1:${APP_PORT})"
              FAILED=1
            fi

            DOMAIN="$(grep -E '^DOMAIN=' .env.docker | tail -1 | cut -d= -f2- | tr -d '\r' | tr -d '"' | tr -d "'" || true)"
            if [ -n "$DOMAIN" ]; then
              if curl -fsSk -o /dev/null --max-time 20 "https://${DOMAIN}/"; then
                echo "HTTPS check OK: https://${DOMAIN}/"
              else
                echo "HTTPS soft-fail for https://${DOMAIN}/ (configure external proxy → 127.0.0.1:${APP_PORT})"
              fi
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "Deploy unhealthy — reverting to $PREVIOUS_SHA"
              if [ "$PREVIOUS_SHA" = "$NEW_SHA" ]; then
                echo "No previous distinct commit to revert to"
                exit 1
              fi
              if ! git cat-file -t "$PREVIOUS_SHA" >/dev/null 2>&1; then
                echo "Previous SHA $PREVIOUS_SHA is not in this repo — not reverting onto a foreign commit"
                exit 1
              fi

              git checkout "$PREVIOUS_SHA"
              COMPOSE_HTTPS=""
              if grep -qE '^ENABLE_EDGE_PROXY=(true|1|yes)$' .env.docker; then
                COMPOSE_HTTPS="--profile https"
              fi
              docker compose --env-file .env.docker --profile https down --remove-orphans
              docker compose --env-file .env.docker build
              # shellcheck disable=SC2086
              docker compose --env-file .env.docker $COMPOSE_HTTPS up -d
              sleep 20
              # shellcheck disable=SC2086
              docker compose --env-file .env.docker $COMPOSE_HTTPS ps

              echo "Reverted to $PREVIOUS_SHA because new deploy failed"
              exit 1
            fi

            echo "Deploy OK: $NEW_SHA"
            git checkout -B develop "$EXPECTED_SHA"

  notify-teams-success:
    name: Notify Teams on success
    needs: [build, announce-pending, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post success to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop succeeded"
          export DETAIL="Server updated successfully.
          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}"
          export COLOR="Good"
          export RUN_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Good")
          run_url = os.environ["RUN_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View workflow run", "url": run_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams success notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL success notify failed"; }

  notify-teams-failure:
    name: Notify Teams on failure
    needs: [build, announce-pending, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.announce-pending.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-develop.yml
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop failed"
          export DETAIL="Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}

          Retry: Actions → Deploy develop → Run workflow."
          export COLOR="Attention"
          export RUN_URL WORKFLOW_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Attention")
          run_url = os.environ["RUN_URL"]
          workflow_url = os.environ["WORKFLOW_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View workflow run", "url": run_url},
                          {"type": "Action.OpenUrl", "title": "Retry workflow", "url": workflow_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams failure notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL failure notify failed"; }
