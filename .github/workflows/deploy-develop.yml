name: Deploy develop

# Push to develop → Teams pending → deploy → Teams success/failure.
# Manual: Actions → Deploy develop → Run workflow.
# Cancel: open the run → Cancel workflow.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  announce-pending:
    name: Notify Teams — deploy pending
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Post pending deploy to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop starting"
          export DETAIL="Build passed — deploying to the server now.
          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}

          Cancel: open the run → Cancel workflow."
          export COLOR="Warning"
          export RUN_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Warning")
          run_url = os.environ["RUN_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View / cancel run", "url": run_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams pending notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL notify failed — deploy will still continue"; }

  deploy:
    name: Deploy to server
    needs: [announce-pending]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "===== disk before cleanup ====="
            df -h / || true
            # Free space from old images/build cache (never --volumes: that would wipe DB data).
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            echo "===== disk after cleanup ====="
            df -h / || true

            PREVIOUS_SHA="$(git rev-parse HEAD)"

            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            NEW_SHA="$(git rev-parse HEAD)"

            echo "Deploying $NEW_SHA (previous was $PREVIOUS_SHA)"

            docker compose --env-file .env.docker --profile https down --remove-orphans
            docker compose --env-file .env.docker build
            docker compose --env-file .env.docker up -d

            echo "Waiting for containers..."
            sleep 25

            echo "===== docker compose ps ====="
            docker compose --env-file .env.docker ps

            FAILED=0

            if docker compose --env-file .env.docker ps | grep -Eiq 'Exit|exited|Restarting|unhealthy|dead'; then
              echo "STATUS CHECK FAILED"
              FAILED=1
            fi

            echo "===== recent logs ====="
            docker compose --env-file .env.docker logs --tail=100 || true

            if docker compose --env-file .env.docker logs --tail=300 2>&1 | grep -Eiq 'Traceback|FATAL|panic|Error response from daemon|npm ERR'; then
              echo "LOG CHECK found serious errors"
              FAILED=1
            fi

            if ! curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:8083/; then
              echo "Frontend HTTP check failed"
              FAILED=1
            fi
            if ! curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:8083/api/docs; then
              echo "API docs HTTP check failed"
              FAILED=1
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "Deploy unhealthy — reverting to $PREVIOUS_SHA"
              if [ "$PREVIOUS_SHA" = "$NEW_SHA" ]; then
                echo "No previous distinct commit to revert to"
                exit 1
              fi

              git checkout "$PREVIOUS_SHA"
              docker compose --env-file .env.docker --profile https down --remove-orphans
              docker compose --env-file .env.docker build
              docker compose --env-file .env.docker up -d
              sleep 20
              docker compose --env-file .env.docker ps

              echo "Reverted to $PREVIOUS_SHA because new deploy failed"
              exit 1
            fi

            echo "Deploy OK: $NEW_SHA"
            git checkout develop
            git reset --hard origin/develop

  notify-teams-success:
    name: Notify Teams on success
    needs: [build, announce-pending, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post success to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop succeeded"
          export DETAIL="Server updated successfully.
          Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}"
          export COLOR="Good"
          export RUN_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Good")
          run_url = os.environ["RUN_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View workflow run", "url": run_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams success notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL success notify failed"; }

  notify-teams-failure:
    name: Notify Teams on failure
    needs: [build, announce-pending, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.announce-pending.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-develop.yml
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not set — skip Teams notify"
            exit 0
          fi
          export TITLE="Deploy develop failed"
          export DETAIL="Repo: ${REPO}
          Branch: ${BRANCH}
          Actor: ${ACTOR}
          Commit: ${SHA:0:7}
          Run: ${RUN_URL}

          Retry: Actions → Deploy develop → Run workflow."
          export COLOR="Attention"
          export RUN_URL WORKFLOW_URL
          python3 <<'PY' > /tmp/teams-payload.json
          import json, os
          title = os.environ["TITLE"]
          detail = os.environ["DETAIL"]
          color = os.environ.get("COLOR", "Attention")
          run_url = os.environ["RUN_URL"]
          workflow_url = os.environ["WORKFLOW_URL"]
          payload = {
              "title": title,
              "text": detail,
              "summary": title,
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                          {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "color": color, "text": title, "wrap": True},
                          {"type": "TextBlock", "text": detail, "wrap": True},
                      ],
                      "actions": [
                          {"type": "Action.OpenUrl", "title": "View workflow run", "url": run_url},
                          {"type": "Action.OpenUrl", "title": "Retry workflow", "url": workflow_url},
                      ],
                  },
              }],
          }
          print(json.dumps(payload))
          PY
          curl -sS -f -H "Content-Type: application/json" \
            --data @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" \
            && echo && echo "Teams failure notification sent" \
            || { echo; echo "::warning::TEAMS_WEBHOOK_URL failure notify failed"; }
