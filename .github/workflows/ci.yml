# Every PR / push: backend tests, frontend build, both Docker images built.
# Push to main: images are also pushed to the registry, tagged with ./VERSION.
#
# Repository settings (only needed for the push):
#   variable IMAGE_REGISTRY      e.g. registry.example.com/takeda-att/   (trailing slash)
#   secret   REGISTRY_USERNAME
#   secret   REGISTRY_PASSWORD
# Servers then run ./scripts/docker-up.sh with the same IMAGE_REGISTRY and IMAGE_TAG.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          APP_VERSION="$(./scripts/app-version.sh)"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$APP_VERSION" >> "$GITHUB_ENV"
          APP_VERSION="$APP_VERSION" IMAGE_TAG="$APP_VERSION" \
            docker compose --env-file .env.docker.example build backend frontend
      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.IMAGE_REGISTRY != ''
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "${IMAGE_REGISTRY%%/*}" -u "$REGISTRY_USERNAME" --password-stdin
          docker compose --env-file .env.docker.example push backend frontend
